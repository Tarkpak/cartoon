[[permission]]
identifier = "allow-open-local-path"
description = "Allow opening local files or folders from the desktop shell"
commands.allow = ["open_local_path"]

[[permission]]
identifier = "allow-open-local-directory"
description = "Allow opening local folders from the desktop shell"
commands.allow = ["open_local_directory"]

[[permission]]
identifier = "allow-open-external-url"
description = "Allow opening validated HTTP and HTTPS links in the system browser"
commands.allow = ["open_external_url"]
